<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title description">
  <title id="title">Poker · 泥嚎！！</title>
  <desc id="description">Poker-sang 的个人主页横幅。三张淡紫与冰蓝的扑克牌在开场时展开，随后轻轻浮动，星点缓慢闪烁。减少动态效果时显示静态画面。</desc>
  <style>
    /* Play the fan-out once; separate inner groups keep the idle motion continuous. */
    .fan-left,.fan-right,.fan-front{transform-box:view-box;transform-origin:0 0}
    .fan-left{animation:unfold-left 1.15s cubic-bezier(.22,.75,.24,1) .15s both}
    .fan-right{animation:unfold-right 1.25s cubic-bezier(.22,.75,.24,1) .23s both}
    .fan-front{animation:deal-front .9s cubic-bezier(.22,.75,.24,1) both}
    .drift-left{animation:float-left 6.8s ease-in-out 1.5s infinite}
    .drift-right{animation:float-right 7.6s ease-in-out 1.5s infinite}
    .drift-front{animation:float-front 7s ease-in-out 1.5s infinite}
    .sparkle{animation:twinkle 4.8s ease-in-out 1.5s infinite both}
    .sparkle-two{animation-duration:5.7s;animation-delay:2.1s}
    .sparkle-three{animation-duration:6.2s;animation-delay:1.8s}
    .sparkle-four{animation-duration:5.1s;animation-delay:2.7s}
    @keyframes unfold-left{
      from{transform:translate(918px,188px) rotate(-4deg);opacity:0}
      15%{opacity:1}
      75%{transform:translate(814px,178px) rotate(-23deg)}
      to{transform:translate(819px,180px) rotate(-22deg);opacity:1}
    }
    @keyframes unfold-right{
      from{transform:translate(918px,188px) rotate(-4deg);opacity:0}
      15%{opacity:1}
      75%{transform:translate(1019px,178px) rotate(23deg)}
      to{transform:translate(1014px,180px) rotate(22deg);opacity:1}
    }
    @keyframes deal-front{
      from{transform:translate(918px,195px) rotate(-4deg);opacity:0}
      75%{transform:translate(918px,169px) rotate(-4deg);opacity:1}
      to{transform:translate(918px,171px) rotate(-4deg);opacity:1}
    }
    @keyframes float-left{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-4px) rotate(-.7deg)}}
    @keyframes float-right{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(4px) rotate(.7deg)}}
    @keyframes float-front{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    @keyframes twinkle{0%,100%{opacity:.4}50%{opacity:1}}
    @media (prefers-reduced-motion:reduce){
      .fan-left,.fan-right,.fan-front,.drift-left,.drift-right,.drift-front,.sparkle{animation:none!important}
    }
  </style>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9178d6" stop-opacity=".10"/><stop offset=".52" stop-color="#4398b9" stop-opacity=".025"/><stop offset="1" stop-color="#ca6d8c" stop-opacity=".08"/></linearGradient>
    <linearGradient id="heading" x1="0" x2="1"><stop stop-color="#252b43"/><stop offset="1" stop-color="#7460ab"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9178d6" stop-opacity=".48"/><stop offset=".48" stop-color="#71849b" stop-opacity=".12"/><stop offset="1" stop-color="#4398b9" stop-opacity=".36"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1" fill="#71849b" opacity=".14"/></pattern>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="348" rx="22"/></clipPath>
    <path id="spade" d="M0-36C-10-23-36-9-36 9C-36 30-11 34 0 17C-2 29-6 36-13 41H13C6 36 2 29 0 17C11 34 36 30 36 9C36-9 10-23 0-36Z"/>
    <path id="diamond" d="M0-27 19 0 0 27-19 0Z"/>
    <path id="heart" d="M0 25C-8 17-30 3-30-12C-30-30-8-32 0-17C8-32 30-30 30-12C30 3 8 17 0 25Z"/>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="350" fill="#71849b" fill-opacity=".05"/>
    <rect width="1200" height="350" fill="url(#wash)"/>
    <path d="M600 0H1200V350H720Z" fill="url(#dots)"/>
    <ellipse cx="922" cy="181" rx="270" ry="113" transform="rotate(-23 922 181)" fill="none" stroke="#9178d6" stroke-opacity=".14"/>
    <ellipse cx="922" cy="181" rx="222" ry="149" transform="rotate(23 922 181)" fill="none" stroke="#4398b9" stroke-opacity=".13"/>
    <path d="M678 276C800 347 1093 277 1199 144" fill="none" stroke="#4398b9" stroke-opacity=".12"/>
    <g font-family="Segoe UI,Inter,Arial,sans-serif">
      <path d="M64 64H92" stroke="#9178d6" stroke-width="3" stroke-linecap="round"/>
      <text x="105" y="69" fill="#626c83" font-size="14" letter-spacing="2.5">POKER-SANG</text>
      <text x="59" y="194" fill="url(#heading)" font-size="120" font-weight="700" letter-spacing="-6">Poker<tspan fill="#ca6d8c">.</tspan></text>
      <text x="66" y="242" fill="#626c83" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" letter-spacing="3">泥嚎！！</text>
      <text x="66" y="302" fill="#626c83" font-size="14" letter-spacing=".6">@Poker-sang</text>
      <path d="M184 297H249" stroke="#71849b" stroke-opacity=".24"/>
      <use xlink:href="#spade" transform="translate(273 297) scale(.16)" fill="#9178d6"/>
      <use xlink:href="#diamond" transform="translate(297 297) scale(.2)" fill="#ca6d8c"/>
    </g>
    <g class="fan-left" transform="translate(819 180) rotate(-22)"><g class="drift-left">
      <rect x="-76" y="-107" width="152" height="214" rx="13" fill="#e7e0f7" stroke="#9178d6" stroke-opacity=".45"/>
      <rect x="-65" y="-96" width="130" height="192" rx="7" fill="none" stroke="#9178d6" stroke-opacity=".22"/>
      <use xlink:href="#diamond" fill="#9178d6" transform="scale(1.3)"/>
      <path d="M-45-73H-27M-36-82V-64M27 73H45M36 64V82" stroke="#9178d6" stroke-opacity=".7" stroke-width="1.5"/>
    </g></g>
    <g class="fan-right" transform="translate(1014 180) rotate(22)"><g class="drift-right">
      <rect x="-76" y="-107" width="152" height="214" rx="13" fill="#dcebf2" stroke="#4398b9" stroke-opacity=".5"/>
      <rect x="-65" y="-96" width="130" height="192" rx="7" fill="none" stroke="#4398b9" stroke-opacity=".25"/>
      <use xlink:href="#heart" fill="#4398b9" transform="scale(1.1)"/>
      <circle cx="-36" cy="-73" r="3" fill="#4398b9"/><circle cx="36" cy="73" r="3" fill="#4398b9"/>
    </g></g>
    <g class="fan-front" transform="translate(918 171) rotate(-4)"><g class="drift-front">
      <rect x="-80" y="-111" width="166" height="230" rx="14" fill="#131626" opacity=".10" transform="translate(0 7)"/>
      <rect x="-80" y="-115" width="160" height="230" rx="14" fill="#f7f4ff" stroke="#9178d6" stroke-opacity=".45"/>
      <rect x="-68" y="-103" width="136" height="206" rx="8" fill="none" stroke="#d9cfee"/>
      <text x="-54" y="-72" font-family="Georgia,serif" font-size="26" fill="#7460a4">A</text>
      <use xlink:href="#spade" transform="translate(-45 -50) scale(.2)" fill="#7460a4"/>
      <g transform="rotate(180)"><text x="-54" y="-72" font-family="Georgia,serif" font-size="26" fill="#7460a4">A</text><use xlink:href="#spade" transform="translate(-45 -50) scale(.2)" fill="#7460a4"/></g>
      <circle r="52" fill="none" stroke="#d9cfee"/>
      <use xlink:href="#spade" transform="translate(0 -2) scale(.93)" fill="#7460a4"/>
      <path d="M0-69V-62M0 62V69M-69 0H-62M62 0H69" stroke="#7460a4" stroke-opacity=".4"/>
    </g></g>
    <g fill="none" stroke-linecap="round">
      <path class="sparkle" d="M715 81V97M707 89H723" stroke="#9178d6" stroke-width="2"/>
      <path class="sparkle sparkle-two" d="M1109 246V258M1103 252H1115" stroke="#ca6d8c" stroke-width="2"/>
      <circle class="sparkle sparkle-three" cx="1088" cy="68" r="4" stroke="#4398b9" stroke-width="1.5"/>
      <circle class="sparkle sparkle-four" cx="752" cy="274" r="3" fill="#ca6d8c" stroke="none"/>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="349" rx="22" fill="none" stroke="url(#edge)"/>
</svg>
